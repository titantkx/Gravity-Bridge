[package]
edition = "2021"
name = "cosmwasm"
version = "0.1.0"

[lib]
crate-type = ["cdylib"]

[dependencies]
cosmwasm-schema = "2.1.4"
cosmwasm-std = {version = "2.1.4", features = ["cosmwasm_1_4", "stargate"]}
cw-storage-plus = "2.0.0"
cw2 = "2.0.0"
prost = "0.13"
serde_json = "1.0.133"
thiserror = "2.0.3"
titan-cosmos-sdk-proto = {git = "https://github.com/titantkx/titan-rust-proto.git", tag = "v3.1.1", package = "cosmos-sdk-proto-titan"}

[dev-dependencies]
cw-multi-test = {version = "2.2.0", features = ["cosmwasm_1_4", "stargate"]}
lazy_static = "1.5.0"
